<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEXA v3 - CapCut</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
<h2>VEXA <span>v3</span></h2>
<button id="btn-video" class="active" onclick="showSection('video')">🎬 Video / Tagli</button>
<button id="btn-audio" onclick="showSection('audio')">🎵 Musica</button>
<button id="btn-testo" onclick="showSection('testo')">✏️ Testo</button>
<button id="btn-effetti" onclick="showSection('effetti')">✨ Effetti</button>
<button id="btn-ai" onclick="showSection('ai')">🤖 AI</button>
<button class="green" onclick="exportVideo()">⬇ ESPORTA</button>
</div>

<div class="main">
<div class="topbar"><div>VEXA <span>STUDIO</span></div><div>9:16 TikTok</div></div>

<div class="video-area">
<div class="video-wrap">
<video id="video" playsinline controls></video>
<div id="overlayText"></div>
<div id="stickerLayer"></div>
</div>
</div>

<div class="panel">
<div id="sec-video">
<div class="card"><b>1. IMPORTA VIDEO</b><input type="file" id="videoInput" accept="video/*">
<div class="row"><button onclick="splitClip()">✂️ DIVIDI QUI</button><button onclick="undo()">↩ ANNULLA</button><button onclick="redo()">↪ RIFAI</button></div>
<div class="row"><button onclick="duplicateClip()">📄 DUPLICA</button><button onclick="overwriteClip()">♻️ SOVRASCRIVI</button><button class="red" onclick="clearAll()">🗑 RESET</button></div>
<div id="clips" class="timeline"></div>
<label>Velocità</label><select id="speed" onchange="setSpeed()"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="3">3x</option></select>
</div>
</div>

<div id="sec-audio" style="display:none">
<div class="card"><b>2. MUSICA</b><input type="file" id="musicInput" accept="audio/*"><audio id="music"></audio>
<div class="row"><button class="green" onclick="playMusic()">▶️ PLAY</button><button class="red" onclick="stopMusic()">⏹ STOP</button><button onclick="toggleLoop()">🔁 LOOP: <span id="loopTxt">OFF</span></button></div>
</div>
</div>

<div id="sec-testo" style="display:none">
<div class="card"><b>3. TESTO + KARAOKE</b><input type="text" id="textInput" placeholder="Scrivi testo..." oninput="updateText()">
<div class="row"><select id="fontSel" onchange="updateText()"><option value="Arial Black">TikTok Bold</option><option value="Impact">Impact</option><option value="Georgia">Serif</option><option value="Courier New">Typewriter</option><option value="Comic Sans MS">Mano</option></select><input type="color" id="colorSel" value="#ffffff" onchange="updateText()"><select id="posSel" onchange="updateText()"><option value="72%">Sotto</option><option value="45%">Centro</option><option value="15%">Sopra</option></select></div>
<div class="row"><button onclick="toggleKaraoke()">🎤 KARAOKE</button><button onclick="clearText()">❌ TOGLI TESTO</button></div>
</div>
</div>

<div id="sec-effetti" style="display:none">
<div class="card"><b>4. EFFETTI</b><label>Filtro</label><select id="filter" onchange="setFilter()"><option value="none">Nessuno</option><option value="grayscale(1)">Bianco e Nero</option><option value="sepia(1)">Vintage</option><option value="saturate(1.8) contrast(1.2)">Vivido</option><option value="blur(3px)">Blur</option><option value="hue-rotate(90deg) saturate(1.5)">Neon</option></select>
<div class="row"><button onclick="rotateVideo()">🔄 RUOTA</button><button onclick="mirrorVideo()">🪞 SPECCHIA</button></div>
<div class="row"><button onclick="addSticker('🔥')">🔥</button><button onclick="addSticker('😂')">😂</button><button onclick="addSticker('❤️')">❤️</button><button onclick="addSticker('⭐')">⭐</button></div>
</div>
</div>

<div id="sec-ai" style="display:none">
<div class="card"><b>5. AI</b><input type="text" id="aiInput" placeholder="Chiedi a VEXA..."><button class="primary" style="width:100%;margin-top:8px" onclick="askAI()">CHIEDI A VEXA ✨</button><p id="aiOut"></p></div>
</div>
</div>

<!-- LE 2 BARRE - SOLO HTML, lo stile è in style.css e la logica è in main.js -->
<div class="timeline-box">
<div class="timeline-label"><b>🔊 VOLUME - Trascina</b><span id="volText">50% 🔊</span></div>
<div class="bar-track" id="volBar"><div class="bar-fill" id="volFill"></div><div class="bar-handle" id="volHandle"></div></div>
<div class="timeline-label"><b>🎬 VIDEO / IMMAGINE - Trascina</b><span id="videoText">0.0s / 0.0s</span></div>
<div class="bar-track" id="videoBar"><div class="bar-fill video-fill" id="videoFill"></div><div class="bar-handle" id="videoHandle" style="left:0%"></div></div>
</div>

</div>

<script>
function showSection(n){
  ['video','audio','testo','effetti','ai'].forEach(x=>{
    document.getElementById('sec-'+x).style.display=(x===n?'block':'none');
  });
  document.querySelectorAll('.sidebar button').forEach(b=>b.classList.remove('active'));
  let b=document.getElementById('btn-'+n); if(b) b.classList.add('active');
}
</script>
<script src="js/editor.js"></script>
<script src="js/main.js"></script>
<script src="js/ai.js"></script>
</body>
</html>
