<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VEXA v2</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><div class="logo">VEXA <span>v2 - CAPCUT MODE</span></div><button class="green" onclick="exportVideo()">⬇ ESPORTA</button></header>
<main>
<div class="video-wrap"><video id="video" playsinline controls></video><div id="overlayText"></div><div id="stickerLayer"></div></div>

<div class="card"><b>1. VIDEO + CLIP</b><input type="file" id="videoInput" accept="video/*">
<div class="row"><button onclick="splitClip()">✂️ DIVIDI QUI</button><button onclick="undo()">↩ ANNULLA</button><button onclick="redo()">↪ RIFAI</button><button class="red" onclick="clearAll()">🗑 RESET</button></div>
<div class="small">Premi una Clip per rivederla. X per cancellarla.</div><div id="clips" class="timeline"></div></div>

<div class="card"><b>2. VELOCITÀ + FILTRO + FORMATO</b><div class="row">
<div><label>Velocità</label><select id="speed" onchange="setSpeed()"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="3">3x</option></select></div>
<div><label>Filtro</label><select id="filter" onchange="setFilter()"><option value="none">Nessuno</option><option value="grayscale(1)">Bianco e Nero</option><option value="sepia(1)">Vintage</option><option value="saturate(1.8) contrast(1.2)">Vivido</option><option value="blur(3px)">Blur</option><option value="hue-rotate(90deg) saturate(1.5)">Neon</option><option value="contrast(1.5) brightness(1.1)">VHS</option></select></div>
<div><label>Formato</label><select onchange="document.querySelector('.video-wrap').style.aspectRatio=this.value"><option value="9/16">9:16 TikTok</option><option value="16/9">16:9 YouTube</option><option value="1/1">1:1 Instagram</option></select></div></div>
<div class="row"><button onclick="rotateVideo()">🔄 RUOTA</button><button onclick="mirrorVideo()">🪞 SPECCHIA</button><button onclick="duplicateClip()">📄 DUPLICA CLIP</button><button onclick="overwriteClip()">♻️ SOVRASCRIVI CLIP</button></div></div>

<div class="card"><b>3. MUSICA - STOP VERO</b><input type="file" id="musicInput" accept="audio/*"><audio id="music"></audio>
<div class="row"><button class="green" onclick="playMusic()">▶️ PLAY</button><button class="red" onclick="stopMusic()">⏹ STOP</button><button onclick="toggleLoop()">🔁 LOOP: <span id="loopTxt">OFF</span></button></div>
<label>Volume Musica</label><input type="range" id="musicVol" min="0" max="100" value="50" oninput="setMusicVol()">
<label>Volume Video</label><input type="range" id="videoVol" min="0" max="100" value="80" oninput="setVideoVol()">
<div class="row"><button onclick="playSfx('boom')">💥 Boom</button><button onclick="playSfx('whoosh')">💨 Whoosh</button><button onclick="playSfx('clap')">👏 Applauso</button></div></div>

<div class="card"><b>4. TESTO + KARAOKE</b><input type="text" id="textInput" placeholder="Scrivi testo... es. VEXA SPINGE" oninput="updateText()">
<div class="row"><div><label>Font</label><select id="fontSel" onchange="updateText()"><option value="Arial Black">TikTok Bold</option><option value="Impact">Impact</option><option value="Georgia">Serif</option><option value="Courier New">Typewriter</option><option value="Comic Sans MS">Mano</option><option value="Verdana">Neon Clean</option></select></div>
<div><label>Colore</label><input type="color" id="colorSel" value="#ffffff" onchange="updateText()"></div>
<div><label>Posizione</label><select id="posSel" onchange="updateText()"><option value="72%">Sotto</option><option value="45%">Centro</option><option value="15%">Sopra</option></select></div></div>
<div class="row"><button onclick="toggleKaraoke()">🎤 KARAOKE / SCORRE</button><button onclick="clearText()">❌ TOGLI TESTO</button><button onclick="addSubtitle()">💬 SOTTOTITOLO</button></div></div>

<div class="card"><b>5. STICKER + TRANSIZIONE + AI</b>
<div class="row"><button onclick="addSticker('🔥')">🔥</button><button onclick="addSticker('😂')">😂</button><button onclick="addSticker('❤️')">❤️</button><button onclick="addSticker('⭐')">⭐</button><button onclick="addSticker('👑')">👑</button></div>
<label>Transizione</label><select id="transSel"><option>Dissolvenza</option><option>Zoom</option><option>Flash</option><option>Slide</option></select>
<input type="text" id="aiInput" placeholder="Chiedi a VEXA: rendilo virale..."><button class="primary" style="width:100%;margin-top:8px" onclick="askAI()">CHIEDI A VEXA ✨</button><p id="aiOut" class="small"></p></div>
</main>
<script src="js/editor.js"></script><script src="js/main.js"></script><script src="js/ai.js"></script>
</body></html>
