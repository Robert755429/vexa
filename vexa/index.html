<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEXA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
<div class="logo">VEXA</div>
<div class="top-actions">
<label class="btn-import">↑ IMPORTA<input type="file" id="videoInput" accept="video/*" hidden></label>
<button class="btn-export" onclick="exportVideo()">↓ ESPORTA</button>
<button class="btn-menu" onclick="toggleMenu()">☰</button>
</div>
</header>

<div id="sidebar" class="sidebar">
<button onclick="showSection('video');toggleMenu()">🎬 Video / Tagli</button>
<button onclick="showSection('audio');toggleMenu()">🎵 Musica</button>
<button onclick="showSection('testo');toggleMenu()">✏️ Testo</button>
<button onclick="showSection('effetti');toggleMenu()">✨ Effetti</button>
<button onclick="showSection('ai');toggleMenu()">🤖 AI</button>
</div>
<div id="overlayMenu" class="overlay-menu" onclick="toggleMenu()"></div>

<div class="main">
<div class="video-wrap">
<video id="video" playsinline controls></video>
<div id="overlayText"></div>
<div id="stickerLayer"></div>
</div>

<div class="controls">
<button onclick="togglePlay()">▶️ Play / Pausa</button>
<button onclick="splitClip()">✂️ TAGLIA QUI</button>
<select id="speed" onchange="setSpeed()"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
</div>
<div class="controls">
<select id="filter" onchange="setFilter()"><option value="none">Nessun filtro</option><option value="grayscale(1)">Bianco e Nero</option><option value="sepia(1)">Vintage</option><option value="saturate(1.8) contrast(1.2)">Vivido</option><option value="blur(3px)">Blur</option><option value="hue-rotate(90deg) saturate(1.5)">Neon</option></select>
</div>

<div id="sec-video">
<div class="card"><div id="clips" class="timeline"></div>
<div class="row"><button onclick="undo()">↩ ANNULLA</button><button onclick="redo()">↪ RIFAI</button><button onclick="duplicateClip()">📄 DUPLICA</button><button class="red" onclick="clearAll()">🗑 RESET</button></div>
</div>
</div>

<div id="sec-audio" style="display:none">
<div class="card"><b>🎵 MUSICA</b><input type="file" id="musicInput" accept="audio/*"><audio id="music"></audio>
<div class="row"><button class="green" onclick="playMusic()">▶️ PLAY</button><button class="red" onclick="stopMusic()">⏹ STOP</button><button onclick="toggleLoop()">🔁 LOOP: <span id="loopTxt">OFF</span></button></div>
</div>
</div>

<div id="sec-testo" style="display:none">
<div class="card"><b>✏️ TESTO + KARAOKE</b><input type="text" id="textInput" placeholder="Scrivi testo..." oninput="updateText()">
<div class="row"><select id="fontSel" onchange="updateText()"><option value="Arial Black">TikTok Bold</option><option value="Impact">Impact</option><option value="Georgia">Serif</option><option value="Courier New">Typewriter</option></select><input type="color" id="colorSel" value="#ffffff" onchange="updateText()"><select id="posSel" onchange="updateText()"><option value="72%">Sotto</option><option value="45%">Centro</option><option value="15%">Sopra</option></select></div>
<div class="row"><button onclick="toggleKaraoke()">🎤 KARAOKE</button><button onclick="clearText()">❌ TOGLI TESTO</button></div>
</div>
</div>

<div id="sec-effetti" style="display:none">
<div class="card"><b>✨ EFFETTI</b><div class="row"><button onclick="rotateVideo()">🔄 RUOTA</button><button onclick="mirrorVideo()">🪞 SPECCHIA</button></div>
<div class="row"><button onclick="addSticker('🔥')">🔥</button><button onclick="addSticker('😂')">😂</button><button onclick="addSticker('❤️')">❤️</button><button onclick="addSticker('⭐')">⭐</button></div>
</div>
</div>

<div id="sec-ai">
<div class="card ai-card"><b>🤖 VEXA AI</b><p>La tua AI di editing.</p>
<input type="text" id="aiInput" placeholder="Chiedi a VEXA...">
<button class="green big" onclick="askAI()">✨ Dammi un'idea</button>
<p id="aiOut"></p>
</div>
</div>

<div class="bar-box">
<div class="bar-label"><b>🔊 VOLUME - Trascina</b><span id="volText">50% 🔊</span></div>
<div class="bar-track" id="volBar"><div class="bar-fill" id="volFill"></div><div class="bar-handle" id="volHandle"></div></div>
<div class="bar-label"><b>🎬 VIDEO - Trascina</b><span id="videoText">0.0s / 0.0s</span></div>
<div class="bar-track" id="videoBar"><div class="bar-fill video-fill" id="videoFill"></div><div class="bar-handle" id="videoHandle"></div></div>
</div>

</div>
<script src="js/main.js"></script>
</body>
</html>
